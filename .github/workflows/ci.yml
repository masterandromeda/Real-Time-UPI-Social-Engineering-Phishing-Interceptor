name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest test_logic.py -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db

      - name: Run pipeline test
        run: python -m pytest test_pipeline.py -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db

  frontend-build:
    name: Frontend Build (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upi-sentinel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: upi-sentinel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001

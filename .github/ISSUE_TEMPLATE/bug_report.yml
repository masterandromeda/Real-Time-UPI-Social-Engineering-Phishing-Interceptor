name: "🐛 Bug Report"
description: Report a bug in UPI Sentinel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report — UPI Sentinel"
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: Describe the bug clearly
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Go to...\n2. Click on...\n3. See error"
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Frontend (Next.js)
        - Backend (FastAPI)
        - Call Intelligence
        - Link Intelligence
        - Device Guardian
        - Scam Prediction
        - Safety Intervention
        - Reports
        - WebSocket
        - Database
